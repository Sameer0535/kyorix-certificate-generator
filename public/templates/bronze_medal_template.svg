    <text text-anchor="middle" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#0A1128" letter-spacing="12">KYORIX</text>
  </g>

  <!-- Top Logo Placeholder Space -->
  <g transform="translate(525, 78)">
